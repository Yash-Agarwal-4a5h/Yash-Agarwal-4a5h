  <animate attributeName="opacity"
           values="1;.3;1"
           dur="1.5s"
           repeatCount="indefinite"/>

</circle>
<!-- ===================================================== -->
<!-- PROFILE PANEL -->
<!-- ===================================================== -->

<rect x="54"
      y="110"
      width="355"
      height="445"
      rx="20"
      fill="#FFFFFF"
      fill-opacity=".55"
      stroke="#BFDBFE"/>

<text x="80"
      y="145"
