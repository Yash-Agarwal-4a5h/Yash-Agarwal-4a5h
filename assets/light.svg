<svg width="1180"
     height="610"
     viewBox="0 0 1180 610"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-label="Light GitHub banner for Yash Agarwal">

  <!-- ===================================================== -->
  <!-- DEFINITIONS -->
  <!-- ===================================================== -->

  <defs>

    <!-- Background Gradient -->

    <linearGradient id="lightBG"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">

      <stop offset="0%" stop-color="#FFFFFF">
        <animate attributeName="stop-color"
                 values="#FFFFFF;#EFF6FF;#FFFFFF"
                 dur="12s"
                 repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#DBEAFE">
        <animate attributeName="stop-color"
                 values="#DBEAFE;#E0F2FE;#DBEAFE"
                 dur="12s"
                 repeatCount="indefinite"/>
      </stop>

    </linearGradient>

    <!-- Cyan Glow -->

    <radialGradient id="cyanGlow"
                    cx="50%"
                    cy="50%"
                    r="65%">

      <stop offset="0%"
            stop-color="#38BDF8"
            stop-opacity=".18"/>

      <stop offset="60%"
            stop-color="#60A5FA"
            stop-opacity=".08"/>

      <stop offset="100%"
            stop-color="#FFFFFF"
            stop-opacity="0"/>

    </radialGradient>

    <!-- Glass Blur -->

    <filter id="glass"
            x="-20%"
            y="-20%"
            width="140%"
            height="140%">

      <feGaussianBlur stdDeviation="14"/>

    </filter>

    <!-- Shadow -->

    <filter id="shadow"
            x="-20%"
            y="-20%"
            width="140%"
            height="140%">

      <feDropShadow dx="0"
                    dy="10"
                    stdDeviation="18"
                    flood-color="#2563EB"
                    flood-opacity=".15"/>

    </filter>

    <!-- Grid -->

    <pattern id="grid"
             width="38"
             height="38"
             patternUnits="userSpaceOnUse">

      <path d="M38 0V38 M0 38H38"
            stroke="#BFDBFE"
            stroke-width=".6"
            opacity=".45"/>

    </pattern>

  </defs>

  <!-- ===================================================== -->
  <!-- BACKGROUND -->
  <!-- ===================================================== -->

  <rect width="1180"
        height="610"
        rx="26"
        fill="url(#lightBG)"/>

  <rect width="1180"
        height="610"
        rx="26"
        fill="url(#grid)"
        opacity=".5"/>

  <!-- Decorative Glow -->

  <circle cx="950"
          cy="100"
          r="260"
          fill="url(#cyanGlow)">

    <animateTransform attributeName="transform"
                      type="translate"
                      values="0 0;-20 20;0 0"
                      dur="16s"
                      repeatCount="indefinite"/>

  </circle>

  <circle cx="120"
          cy="520"
          r="240"
          fill="#3B82F6"
          opacity=".05">

    <animate attributeName="opacity"
             values=".03;.08;.03"
             dur="8s"
             repeatCount="indefinite"/>

  </circle>
  <!-- ===================================================== -->
<!-- FLOATING PARTICLES -->
<!-- ===================================================== -->

<g opacity=".8">

  <circle cx="150"
          cy="80"
          r="2.5"
          fill="#0EA5E9">

    <animateMotion dur="18s"
                   repeatCount="indefinite"
                   path="M0 0 C30 60 50 120 0 180"/>

  </circle>

  <circle cx="230"
          cy="140"
          r="2"
          fill="#2563EB">

    <animateMotion dur="14s"
                   repeatCount="indefinite"
                   path="M0 0 C-20 60 40 140 10 220"/>

  </circle>

  <circle cx="890"
          cy="130"
          r="2.3"
          fill="#38BDF8">

    <animateMotion dur="20s"
                   repeatCount="indefinite"
                   path="M0 0 C-50 80 -30 180 -70 260"/>

  </circle>

  <circle cx="1030"
          cy="260"
          r="1.8"
          fill="#3B82F6">

    <animateMotion dur="16s"
                   repeatCount="indefinite"
                   path="M0 0 C40 -60 70 -120 20 -220"/>

  </circle>

</g>
<!-- ===================================================== -->
<!-- GLASS PANEL -->
<!-- ===================================================== -->

<rect x="28"
      y="28"
      width="1124"
      height="554"
      rx="24"
      fill="rgba(255,255,255,.55)"
      stroke="#BFDBFE"
      stroke-width="1.5"
      filter="url(#shadow)"/>

<rect x="28"
      y="28"
      width="1124"
      height="554"
      rx="24"
      fill="none"
      stroke="#60A5FA"
      stroke-opacity=".25">

  <animate attributeName="stroke-opacity"
           values=".15;.4;.15"
           dur="5s"
           repeatCount="indefinite"/>

</rect>
<!-- ===================================================== -->
<!-- TERMINAL HEADER -->
<!-- ===================================================== -->

<rect x="48"
      y="48"
      width="1084"
      height="46"
      rx="14"
      fill="#F8FAFC"
      stroke="#CBD5E1"/>

<circle cx="76"
        cy="71"
        r="6"
        fill="#EF4444"/>

<circle cx="98"
        cy="71"
        r="6"
        fill="#FBBF24"/>

<circle cx="120"
        cy="71"
        r="6"
        fill="#22C55E"/>

<text x="150"
